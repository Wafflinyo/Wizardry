<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wizardry — Rigged Wizard Preview</title>
<style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 15%,#184b54,#06131e 70%);color:#e8f6ed;font-family:system-ui;padding:15px}main{max-width:940px;margin:auto;border:1px solid #9c8356;background:#07192b;border-radius:14px;overflow:hidden}header,footer{padding:15px 20px}header{border-bottom:1px solid #6c705c}h1{font-family:Georgia,serif;color:#f5dba6;margin:0}p{margin:7px 0;color:#91bbc6;font-size:13px}canvas{display:block;width:100%;aspect-ratio:760/420;max-height:65dvh;background:#0b2031}section{padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}button{border:1px solid #bf9b67;border-radius:8px;background:#264754;color:#f6eacc;padding:12px 16px;font-weight:700}#status{font-weight:700;color:#8cdded}footer{color:#96aeb5;font-size:12px}</style></head><body><main><header><h1>WIZARDRY · Rigged Wizard</h1><p>Articulated shoulder, elbow, wrist + one fixed-length staff · transparent 2D skeletal puppet</p></header><canvas id="stage" width="760" height="420"></canvas><section><button id="again">Cast again</button><button id="loop">Auto replay: ON</button><button id="length">Trace: 1.7s</button><span id="status">Loading...</span></section><footer>No generated in-between images. Same body and staff for every pose. This is a rigged 2D test, not a 3D mesh.</footer></main><script src="./assets/wizard-rig-v31.js?v=0.31.0"></script>
<script>(()=>{const c=document.querySelector("#stage"),ctx=c.getContext("2d");let begin=performance.now(),loop=true,trace=1700;const stages=[["idle",500],["raising",420],["tracing-auto",trace],["lowering",460],["idle",700]];function tick(t){const total=stages.reduce((a,b)=>a+b[1],0),at=loop?(t-begin)%total:Math.min(total-1,t-begin);let elapsed=0,stage="idle",p=0;for(const [s,d] of stages){if(at<elapsed+d){stage=s;p=(at-elapsed)/d;break;}elapsed+=d;}ctx.fillStyle="#0a2030";ctx.fillRect(0,0,760,420);ctx.fillStyle="#173e4a";ctx.fillRect(0,320,760,100);for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(370,367,85+i*30,15+i*9,0,0,Math.PI*2);ctx.strokeStyle="#76cad135";ctx.stroke();}ctx.save();ctx.translate(350,368);ctx.scale(1.2,1.2);const ok=window.WizardryRig?.draw(ctx,{time:t,stage,progress:p});ctx.restore();document.querySelector("#status").textContent=!ok?"Loading...":stage==="idle"?"IDLE":stage==="raising"?"EXTENDING":stage==="tracing-auto"?"WAVING / TRACING":"LOWERING";requestAnimationFrame(tick);}document.querySelector("#again").onclick=()=>{loop=false;begin=performance.now();document.querySelector("#loop").textContent="Auto replay: OFF";};document.querySelector("#loop").onclick=()=>{loop=!loop;begin=performance.now();document.querySelector("#loop").textContent="Auto replay: "+(loop?"ON":"OFF")};document.querySelector("#length").onclick=()=>{trace=trace===1700?3000:1700;stages[2][1]=trace;begin=performance.now();document.querySelector("#length").textContent="Trace: "+(trace/1000).toFixed(1)+"s";};requestAnimationFrame(tick)})();</script></body></html>
