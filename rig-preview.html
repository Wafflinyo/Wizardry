<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wizardry | One-Staff Rig Test</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% 20%,#1a4b54,#051421 70%);color:#eaf6e7;font:14px system-ui;padding:14px}main{max-width:900px;margin:auto;border:1px solid #bd9a57;border-radius:12px;overflow:hidden;background:#091b2d}header{padding:17px;border-bottom:1px solid #52606e}h1{font:700 28px Georgia,serif;color:#eed39c;margin:0}p{color:#aecbd1;margin:8px 0 0}canvas{width:100%;display:block;background:#0a2030;aspect-ratio:800/440}section{padding:12px 15px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}button{border:1px solid #bc9a68;color:#eee4c9;background:#294753;border-radius:7px;padding:10px 16px}b{color:#8aebe6}footer{padding:12px;color:#aac6c7;border-top:1px solid #435a60}</style></head><body><main><header><h1>Wizardry — One-Staff Character Rig</h1><p>Single staff · connected arm joints · smooth idle and continuous cast tracing</p></header><canvas id="view" width="800" height="440"></canvas><section><button id="idle">Play idle</button><button id="cast">Play casting</button><button id="auto">Cycle both</button><b id="mode">Loading...</b></section><footer>The exact same wizard, with one fixed-length staff, is used for both motions. These are continuous rig animations, not unrelated image frames.</footer></main><script src="./assets/wizard-rig-v32.js?v=0.32.0"></script><script>(()=>{const cv=document.querySelector('canvas'),c=cv.getContext('2d');let mode='cycle',started=performance.now();document.getElementById('idle').onclick=()=>{mode='idle';started=performance.now()};document.getElementById('cast').onclick=()=>{mode='cast';started=performance.now()};document.getElementById('auto').onclick=()=>{mode='cycle';started=performance.now()};function render(now){c.fillStyle='#092330';c.fillRect(0,0,800,440);for(let j=0;j<4;j++){c.beginPath();c.ellipse(400,390,125+j*36,16+j*8,0,0,Math.PI*2);c.strokeStyle='#69d3d433';c.stroke()}let t=now-started,stage='idle',p=0,traceMs=0;if(mode!=='idle'){const seq=[['idle',mode==='cycle'?750:0],['raising',450],['tracing-auto',2350],['lowering',540],['idle',700]];const total=seq.reduce((n,item)=>n+item[1],0);t%=total;let d=0;for(const [s,ms] of seq){if(t<d+ms){stage=s;p=(t-d)/ms;traceMs=t-(mode==='cycle'?1200:450);break;}d+=ms}}c.save();c.translate(400,405);c.scale(1.65,1.65);const drawn=WizardryRig.draw(c,{stage,progress:p,traceMs:Math.max(0,traceMs),time:now});c.restore();document.getElementById('mode').textContent=drawn?(stage==='idle'?'Breathing idle':stage==='raising'?'Extending arm':stage==='tracing-auto'?'Waving staff / tracing':'Returning to idle'):'Loading...';requestAnimationFrame(render)}requestAnimationFrame(render)})();</script></body></html>
