<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Wizardry — Approved Wizard Animations</title>
<style>*{box-sizing:border-box}body{margin:0;padding:12px;background:radial-gradient(circle at 50% -10%,#225966,#061725 70%);color:#dcefed;font:14px system-ui,sans-serif}main{max-width:860px;margin:auto;border:1px solid #aa9666;border-radius:14px;background:#092132;overflow:hidden}header,footer{padding:15px}h1{margin:0;font:700 27px Georgia,serif;color:#f5d8a4}p,footer{color:#abced1;font-size:13px;line-height:1.5}canvas{display:block;width:100%;aspect-ratio:800/500;background:linear-gradient(#0c2233,#143642)}section{padding:12px;display:flex;gap:9px;flex-wrap:wrap;align-items:center}button{border:1px solid #cda66a;color:#fff0ce;background:#254a5a;border-radius:8px;padding:11px 16px;font-weight:700}button.on{background:#916a39}#phase{font-size:12px;color:#8cf2e7;font-weight:700}</style></head><body><main><header><h1>WIZARDRY · Approved Wizard Animations</h1><p>Same 28 transparent character frames used in battle. One wizard, one staff, with no procedural arm overlay.</p></header><canvas id="scene" width="800" height="500" aria-label="Wizard breathing and casting animation preview"></canvas><section><button id="idle">Idle loop</button><button id="cast">Cast once</button><button id="both" class="on">Repeat both</button><span id="phase">Loading…</span></section><footer>The casting loop continues during the spell, then lowers the staff and returns to the original resting pose.</footer></main>
<script>(()=>{"use strict";
const c=document.querySelector("canvas"),g=c.getContext("2d"),sprite=new Image();sprite.decoding="async";sprite.src="./assets/wizard-approved-animations-v33.png";let mode="both",start=performance.now();const smooth=t=>{t=Math.max(0,Math.min(1,t));return t*t*(3-2*t)},wave=ms=>16+(Math.floor(Math.max(0,ms)/110)%8);
for(const id of ["idle","cast","both"])document.getElementById(id).onclick=()=>{mode=id;start=performance.now();for(const n of ["idle","cast","both"])document.getElementById(n).classList.toggle("on",n===id)};
function frame(t){const stages=[["idle",650],["raising",300],["wave",2320],["lowering",520],["idle",850]];
let f=Math.floor((t%1440)/120)%12,name="IDLE";if(mode==="idle")return [f,name];
const full=stages.reduce((sum,s)=>sum+s[1],0),elapsed=mode==="both"?(t-start)%full:Math.min(full-0.01,t-start);
let at=0;for(const [stage,duration] of stages){if(elapsed<at+duration){const p=(elapsed-at)/duration;
if(stage==="raising"){f=12+Math.min(3,Math.floor(smooth(p)*4));name="EXTENDING";}
else if(stage==="wave"){f=wave(elapsed-at);name="WAVING / TRACING";}
else if(stage==="lowering"){const from=wave(2320);f=p<.38?Math.min(23,from+Math.floor(smooth(p/.38)*(24-from))):24+Math.min(3,Math.floor(smooth((p-.38)/.62)*4));name="LOWERING";}
return [f,name];}at+=duration;}return [f,name]}
function draw(now){g.fillStyle="#0f2e3c";g.fillRect(0,0,800,500);g.fillStyle="#234d5b";g.beginPath();g.ellipse(400,430,145,21,0,0,Math.PI*2);g.fill();
const [f,name]=frame(now);const ready=sprite.complete&&sprite.naturalWidth===512;
if(ready){g.imageSmoothingEnabled=true;g.imageSmoothingQuality="high";g.drawImage(sprite,(f%4)*128,Math.floor(f/4)*128,128,128,280,66,240,355);}
document.getElementById("phase").textContent=ready?name:"Loading sprites…";requestAnimationFrame(draw)}
requestAnimationFrame(draw)})();
</script></body></html>
